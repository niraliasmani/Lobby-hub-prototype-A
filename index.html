<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>*,*::before,*::after{box-sizing:border-box}:root{color-scheme:light}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Lobby Hub 2.0 Prototype</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Lobby Hub">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Layout: a viewer surround (theme-aware) holding one iPad mini device (744×1133, iOS light, fixed palette from the Figma file) plus a test-task rail. */
:root{
  --page:#e9eaee; --page-fg:#1c1d22; --page-muted:#5e6068; --page-line:#cfd1d8; --page-card:#f7f7f9; --page-accent:#0074c8;
  --ios:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Inter","Helvetica Neue",Arial,sans-serif;
  /* device palette (from Figma) */
  --blue:#0074c8; --label:#000; --label2:rgba(60,60,67,.6); --label3:rgba(60,60,67,.3); --sep:#c6c6c8; --grouped:#f2f2f7;
  --green:#068a1e; --red:#d70015; --navy:#00436d; --fill:rgba(120,120,128,.12);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--page:#16171b;--page-fg:#ecedf1;--page-muted:#9a9ca5;--page-line:#2e3037;--page-card:#1f2026;--page-accent:#4aa3e8;color-scheme:dark}}
:root[data-theme="dark"]{--page:#16171b;--page-fg:#ecedf1;--page-muted:#9a9ca5;--page-line:#2e3037;--page-card:#1f2026;--page-accent:#4aa3e8;color-scheme:dark}
html,body{height:100%}
body{background:var(--page);color:var(--page-fg);font-family:var(--ios);-webkit-font-smoothing:antialiased;overflow-x:hidden}
.viewer{min-height:100%;box-sizing:border-box;display:flex;gap:28px;justify-content:center;align-items:flex-start;padding-block:24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.rail{width:280px;flex:none;display:flex;flex-direction:column;gap:18px;position:sticky;top:24px}
.rail h1{font-size:20px;font-weight:700;margin:0;letter-spacing:-.01em;text-wrap:balance}
.rail .sub{font-size:13px;color:var(--page-muted);margin:4px 0 0;line-height:1.45}
.rail h2{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--page-muted);margin:0 0 8px;font-weight:600}
.tasks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;border:1px solid var(--page-line);border-radius:10px;background:var(--page-card);overflow:hidden}
.tasks li{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;font-size:14px;line-height:1.35;border-top:1px solid var(--page-line)}
.tasks li:first-child{border-top:0}
.tasks input{margin-top:2px;accent-color:var(--page-accent)}
.tasks label{cursor:pointer}
.tasks li.done label{color:var(--page-muted);text-decoration:line-through}
.rail .row{display:flex;gap:8px;flex-wrap:wrap}
.rbtn{font:600 13px var(--ios);border:1px solid var(--page-line);background:var(--page-card);color:var(--page-fg);border-radius:8px;padding:8px 12px;cursor:pointer}
.rbtn:hover{border-color:var(--page-accent)}
.rbtn:focus-visible,.tasks input:focus-visible{outline:2px solid var(--page-accent);outline-offset:2px}
.hint{font-size:12px;color:var(--page-muted);line-height:1.5;margin:0}
.stage{flex:none;position:relative}
@media (max-width:1100px){.viewer{flex-direction:column;align-items:center}.rail{position:static;width:100%;max-width:744px}}
/* full-bleed on the device itself */
body.bare .viewer{padding:0;gap:0}
body.bare .rail{display:none}

/* ===== device ===== */
#device{--sb:24px;width:744px;height:1133px;position:relative;touch-action:manipulation;-webkit-tap-highlight-color:transparent;overflow:hidden;background:#000;border-radius:22px;box-shadow:0 0 0 10px #1b1c20,0 0 0 11px #3a3b40,0 30px 60px rgba(0,0,0,.25);transform-origin:top left;font-family:var(--ios);color:var(--label);font-size:17px;line-height:1.29;-webkit-user-select:none;user-select:none}
body.bare #device{border-radius:0;box-shadow:none;--sb:0px}
body.bare .statusbar,body.bare .homebar{display:none}
html.bare-root,body.bare{overflow:hidden;overscroll-behavior:none;background:#000}
body.bare .stage{margin:0 auto}
#device *{box-sizing:border-box}
:where(#device) button{font-family:inherit;border:0;background:none;padding:0;color:inherit;cursor:pointer;font-size:inherit}
#device input{font-family:inherit}
.statusbar{position:absolute;left:0;right:0;top:0;height:var(--sb);overflow:hidden;z-index:60;display:flex;justify-content:space-between;align-items:center;padding:0 16px;font-size:12px;font-weight:600;pointer-events:none;color:#000;transition:color .3s}
.statusbar .r{display:flex;align-items:center;gap:6px}
.statusbar .batt{width:24px;height:11px;border:1px solid currentColor;border-radius:3px;padding:1px;opacity:.9;position:relative}
.statusbar .batt i{display:block;height:100%;background:currentColor;border-radius:1px}
#device.sheeted .statusbar{color:#fff}
.homebar{position:absolute;bottom:8px;left:50%;width:216px;height:5px;margin-left:-108px;border-radius:3px;background:#000;z-index:70;pointer-events:none}
#stackwrap{position:absolute;inset:0;background:var(--grouped);transition:transform .38s cubic-bezier(.2,.8,.2,1),border-radius .38s,filter .38s;transform-origin:50% 0;overflow:hidden}
#device.sheeted #stackwrap{transform:translateY(22px) scale(.955);border-radius:10px;filter:brightness(.82)}
#device.sheeted2 #sheetlayer .sheet:not(:last-child){transform:translateY(-6px) scale(.96);filter:brightness(.85)}
.screen{position:absolute;inset:0;background:var(--grouped);display:flex;flex-direction:column;transition:transform .36s cubic-bezier(.2,.8,.2,1)}
.screen.off-right{transform:translateX(100%)}
.screen.off-left{transform:translateX(-30%)}
.screen.under::after{content:"";position:absolute;inset:0;background:rgba(0,0,0,.08)}
.scroll{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;scrollbar-width:none;position:relative}
.scroll::-webkit-scrollbar{display:none}

/* nav bar */
.nav{flex:none;background:#fff;padding-top:var(--sb)}
.nav .bar{height:50px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 16px}
.nav .back{display:flex;align-items:center;gap:4px;color:var(--blue);font-size:17px;justify-self:start}
.nav .back svg{width:13px;height:21px}
.nav .title{font-weight:600;font-size:17px;text-align:center}
.nav .acts{justify-self:end;display:flex;gap:22px;color:var(--blue)}
.nav .acts button{width:26px;height:26px;display:grid;place-items:center}
.nav .acts svg{width:24px;height:24px}
.strip{height:44px;display:flex;align-items:center;border-top:.5px solid var(--sep);border-bottom:.5px solid var(--sep);font-size:17px;color:var(--label2);background:#fff}
.strip .d{background:var(--green);color:#fff;font-weight:600;height:100%;width:108px;display:grid;place-items:center;flex:none}
.strip .s1{padding-left:9px;width:212px}
.strip .s2{flex:1}
.strip .s3{padding-right:16px}

/* hub */
.sectbar{height:64px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 16px;background:var(--grouped);border-bottom:.5px solid var(--sep)}
.sectbar h2{font-size:22px;font-weight:700;margin:0;letter-spacing:-.01em}
.sectbar .links{display:flex;gap:18px}
.link{color:var(--blue);font-weight:600;font-size:17px}
.itin{height:219px;display:flex;gap:20px;padding:16px 24px;overflow-x:auto;scrollbar-width:none;border-bottom:.5px solid var(--sep)}
.itin::-webkit-scrollbar{display:none}
.icard{flex:none;width:330px}
.icard .date{font-size:17px;height:22px;margin-bottom:4px}
.icard .date b{font-weight:600}
.icard .date span{color:var(--label2)}
.icard .card{background:#fff;border:1px solid var(--sep);border-radius:10px;padding:16px;height:161px}
.icard .hd{display:flex;justify-content:space-between;align-items:flex-start;height:36px}
.icard .fl{display:flex;gap:4px;align-items:center}
.icard .fl img{width:30px;height:30px;border-radius:50%}
.icard .fl b{display:block;font-size:17px;font-weight:600;line-height:20px}
.icard .fl small{display:block;font-size:13px;color:var(--label2);line-height:16px}
.ontime{background:var(--green);color:#fff;font-size:13px;font-weight:600;border-radius:4px;padding:3px 6px}
.icard .legs{display:flex;justify-content:space-between;margin-top:12px}
.icard .code{font-size:34px;font-weight:700;letter-spacing:-.01em;line-height:41px}
.icard .gate{font-size:15px;margin-left:8px}
.icard .city{font-size:13px;color:var(--label2);line-height:18px;white-space:nowrap}
.icard .tm{font-size:17px;font-weight:600;line-height:22px}
.search{margin:8px 10px;height:36px;border-radius:10px;background:var(--fill);display:flex;align-items:center;gap:6px;padding:0 8px;color:var(--label2)}
.search svg{width:20px;height:20px;flex:none}
.search input{border:0;background:none;outline:none;font-size:17px;flex:1;color:var(--label);min-width:0}
.search input::placeholder{color:var(--label2)}
.glist{padding:8px 12px 24px 12px;display:flex;flex-direction:column;gap:16px}
.grow{display:flex;align-items:flex-start;gap:12px}
.selc{width:32px;height:44px;flex:none;display:grid;place-items:center;margin-top:24px}
.selc i{width:26px;height:26px;border-radius:50%;border:2px solid var(--blue);display:grid;place-items:center;transition:background .15s}
.selc.on i{background:var(--blue)}
.selc i svg{width:15px;height:15px;color:#fff;opacity:0}
.selc.on i svg{opacity:1}
.gcard{flex:1;min-width:0;background:#fff;border-radius:10px;overflow:hidden;transition:box-shadow .2s}
.gcard.sel{box-shadow:0 0 0 2px var(--blue) inset}
.gtop{padding:16px 16px 14px;cursor:pointer;transition:background .15s}
.gtop:active{background:#ececf0}
.gname{display:flex;align-items:center;gap:16px;height:44px}
.seat{width:44px;height:44px;border-radius:6px;background:var(--grouped);color:var(--blue)!important;font-size:20px!important;font-weight:600;display:grid;place-items:center;flex:none}
.seat:active{background:#e3e3e8}
.nm{font-size:20px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nm b{font-weight:600}
.pill{font-size:15px;font-weight:600;border-radius:13px;padding:3px 10px;white-space:nowrap;display:inline-flex;align-items:center;gap:4px}
.pill svg{width:14px;height:14px}
.p-in{background:rgba(0,128,93,.12);color:var(--green)}
.p-out{background:#e5e5ea;color:rgba(60,60,67,.6)}
.p-mvp{background:rgba(0,67,109,.1);color:var(--navy)}
.p-100k{background:rgba(126,98,61,.12);color:#7e623d}
.addbtn{height:42px;width:94px;border:2px solid var(--blue);border-radius:8px;color:var(--blue);font-weight:600;font-size:17px;display:flex;align-items:center;justify-content:center;gap:4px;flex:none;margin-left:8px}
.addbtn svg{width:16px;height:16px}
.chev{color:#c4c4c7;flex:none;width:20px;height:44px;display:grid;place-items:center}
.chev svg{width:9px;height:15px}
.gsub{font-size:13px;color:var(--label2);margin:10px 0 0 45px}
.gsub em{font-style:normal;color:var(--green)}
.gdet{border-top:.5px solid var(--sep);margin-left:60px}
.drow{display:flex;align-items:center;min-height:60px;padding:8px 16px 8px 0;border-bottom:.5px solid var(--sep);position:relative;cursor:pointer;width:100%;text-align:left}
.drow:last-child{border-bottom:0}
.drow .ic{position:absolute;left:-45px;width:30px;display:grid;place-items:center}
.drow .ic svg{width:22px;height:22px}
.drow .tx{flex:1;min-width:0}
.drow .t{font-size:17px}
.drow .t span{color:var(--label2)}
.drow .s{font-size:13px;color:var(--label2);line-height:16px}
.drow .s em{font-style:normal;color:var(--green)}
.drow .s .bad{color:var(--red)}
.drow .s .warn{color:#de750c}
.drow.sub{margin-left:40px;width:calc(100% - 40px)}
.drow.sub .ic{left:-45px}
.drow.sub .chev{color:#d9d9dc}
.drow .amt{color:var(--red);font-size:17px;margin-right:4px}
.actionbar{flex:none;background:#fff;border-top:.5px solid var(--sep);height:104px;padding:12px 16px 0;display:flex;align-items:flex-start;gap:24px}
.actionbar .cnt{flex:1;font-size:17px;color:var(--label2);height:42px;display:flex;align-items:center}
.abtn{height:42px;display:flex;align-items:center;gap:6px;font-weight:600;font-size:17px;color:var(--blue)}
.abtn svg{width:20px;height:20px}
.abtn:disabled{color:var(--label3);cursor:default}
.primary{height:42px;padding:0 18px;border-radius:8px;background:var(--blue);color:#fff!important;font-weight:600;font-size:17px}
.primary:disabled{background:#e5e5ea;color:var(--label3)!important;cursor:default}
.empty{padding:40px 16px;text-align:center;color:var(--label2)}

/* detail screens */
.chips{flex:none;background:#fff;border-bottom:.5px solid var(--sep);padding:14px 16px;display:flex;gap:16px;overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;width:208px;height:58px;border-radius:4px;border:1px solid var(--navy);padding:6px 10px;text-align:left;position:relative;background:#fff}
.chip.on{background:#c2d3de;border-color:#c2d3de;color:var(--navy)}
.chip span{display:block;font-size:17px;line-height:20px;color:var(--label2)}
.chip.on span{color:var(--navy)}
.chip b{display:block;font-size:17px;font-weight:600;line-height:22px}
.chip.on b{color:var(--navy)}
.chip .p-mvp{position:absolute;right:10px;top:6px;font-size:13px;padding:1px 8px;background:rgba(0,67,109,.12)}
.grp{background:#fff;border-top:.5px solid var(--sep);border-bottom:.5px solid var(--sep);margin-top:16px}
.grp + .grp{margin-top:14px}
.ghead{display:flex;justify-content:space-between;align-items:center;min-height:48px;padding:0 16px;font-weight:600;font-size:17px;border-bottom:.5px solid var(--sep)}
.ghead:last-child{border-bottom:0}
.ghead .meta{font-weight:400;color:var(--label2)}
.lrow{display:flex;align-items:center;gap:14px;min-height:48px;padding:8px 16px;width:100%;text-align:left;position:relative}
.lrow::after{content:"";position:absolute;left:54px;right:0;bottom:0;border-bottom:.5px solid var(--sep)}
.lrow:last-child::after{display:none}
.lrow .ic{width:26px;display:grid;place-items:center;flex:none}
.lrow .ic svg{width:22px;height:22px}
.lrow .tx{flex:1;min-width:0}
.lrow .t{font-size:17px}
.lrow .t span{color:var(--label2)}
.lrow .s{font-size:13px;color:var(--label2);line-height:16px}
.lrow .v{color:var(--label2);font-size:17px}
.lrow .chev{height:auto}
.lrow.add .t{color:var(--blue)}
.lrow.add .ic{color:var(--blue)}
.known{background:rgba(0,128,93,.12);color:var(--green);font-weight:600;font-size:15px;border-radius:13px;padding:3px 10px;display:inline-flex;gap:4px;align-items:center}
.known svg{width:14px;height:14px}
.note{font-size:15px;color:var(--label2);padding:14px 16px}
.attn{padding:14px 16px;border-bottom:.5px solid var(--sep)}
.attn .h{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.attn .h b{display:flex;gap:6px;align-items:center;font-size:20px;font-weight:600}
.attn .h b svg{width:22px;height:22px;color:#de750c}
.attn p{margin:0;font-size:15px;line-height:20px}
.attn .more{color:var(--blue);font-weight:600;font-size:15px;margin-top:14px;display:flex;align-items:center;gap:4px}
.dvs{font-size:13px;font-weight:400;margin-left:6px}
.btnrow{display:flex;justify-content:flex-end;padding:12px 16px;min-height:48px;align-items:center}

/* sheets */
#sheetlayer{position:absolute;inset:0;pointer-events:none;z-index:40}
.sheet{position:absolute;left:0;right:0;top:calc(var(--sb) + 10px);bottom:0;background:var(--grouped);border-radius:10px 10px 0 0;display:flex;flex-direction:column;overflow:hidden;transform:translateY(105%);transition:transform .4s cubic-bezier(.2,.85,.2,1),filter .3s;pointer-events:auto;box-shadow:0 -1px 0 rgba(0,0,0,.04)}
.sheet.in{transform:none}
.snav{flex:none;height:44px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 12px;background:#fff;border-bottom:.5px solid var(--sep)}
.snav .title{font-weight:600;font-size:17px}
.snav .l{justify-self:start;color:var(--blue)}
.snav .r{justify-self:end;color:var(--blue)}
.snav .r:disabled{color:var(--label3)}
.snav .r svg{width:20px;height:20px}
.ig{background:#fff;border-radius:10px;margin:16px 16px 0;overflow:hidden}
.igrow{display:flex;align-items:center;min-height:40px;padding:0 15px;position:relative;font-size:15px}
.igrow::after{content:"";position:absolute;left:15px;right:0;bottom:0;border-bottom:.5px solid var(--sep)}
.igrow:last-child::after{display:none}
.igrow .k{width:180px;flex:none}
.igrow .val{flex:1;min-width:0}
.igrow input{border:0;outline:none;font-size:15px;width:100%;background:none;color:var(--label);padding:10px 0}
.igrow input::placeholder{color:#c4c4c7}
.igrow .opt{color:var(--label2);font-size:13px}
.igrow .pick{color:var(--blue);display:inline-flex;gap:4px;align-items:center}
.igrow .pick svg{width:12px;height:14px}
.igrow .datep{background:var(--grouped);color:var(--blue);border-radius:6px;padding:5px 11px}
.foot{font-size:12px;color:var(--label2);margin:6px 32px 0;line-height:16px}
.ighd{font-size:15px;font-weight:600;margin:20px 32px -8px}
.banner{display:flex;align-items:center;gap:12px;margin:16px 16px 0;background:#e7f1ef;border-radius:6px;padding:12px 16px;border-left:6px solid #00805d;font-size:14px;font-weight:600}
.banner svg{width:18px;height:18px;color:#00805d}
.destr{color:var(--red);display:flex;gap:12px;align-items:center;min-height:40px;padding:0 15px;width:100%;font-size:15px}
.destr svg{width:18px;height:18px}
.blink{color:var(--blue);display:flex;gap:8px;align-items:center;min-height:40px;padding:0 15px;width:100%;font-size:15px}
.blink svg{width:18px;height:18px}
.seg{margin:14px 16px;background:#e3e3e8;border-radius:8px;padding:2px;display:grid;grid-template-columns:1fr 1fr}
.seg button{height:28px;border-radius:7px;font-size:13px!important;font-weight:500}
.seg button.on{background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.12);font-weight:600}
.remark{display:flex;align-items:center;min-height:58px;padding:0 16px;border-bottom:.5px solid var(--sep);background:#fff;font-size:15px}
.remark .n{width:44px;color:var(--label2);font-size:15px}
.remark .x{flex:1}
.kv{display:grid;padding:12px 16px 14px;gap:4px 16px;background:#fff;border-bottom:.5px solid var(--sep)}
.kv small{font-size:12px;color:var(--label2);text-transform:uppercase}
.kv div{font-size:17px}
.iosgroup{background:#fff;border-radius:10px;margin:0 16px;overflow:hidden}
.irow{display:flex;align-items:center;gap:16px;min-height:44px;padding:0 14px;position:relative;width:100%;text-align:left;font-size:17px}
.irow::after{content:"";position:absolute;left:60px;right:0;bottom:0;border-bottom:.5px solid var(--sep)}
.irow:last-child::after{display:none}
.irow .ic{width:30px;display:grid;place-items:center;flex:none}
.irow .ic svg{width:24px;height:24px}
.irow .tx{flex:1}
.irow .chev{height:auto}
.gl{font-size:17px;font-weight:600;margin:16px 16px 8px}
.ssearch{margin:16px 16px 0;height:36px;border-radius:10px;background:var(--fill);display:flex;align-items:center;gap:6px;padding:0 8px;color:var(--label2)}
.ssearch svg{width:18px;height:18px}
.ssearch input{border:0;background:none;outline:none;font-size:17px;flex:1;min-width:0}
.ssearch input::placeholder{color:var(--label2)}
.sbottom{flex:none;background:#fff;border-top:.5px solid var(--sep);height:96px;padding:14px 16px 0;display:flex;justify-content:space-between;align-items:flex-start}
.obtn{height:40px;padding:0 18px;border-radius:8px;border:2px solid var(--red)!important;color:var(--red)!important;font-weight:600;font-size:15px!important}
.gbtn{height:40px;padding:0 18px;border-radius:8px;background:#00805d!important;color:#fff!important;font-weight:600;font-size:15px!important}
.gbtn:disabled{opacity:.4}
.scanimg{height:616px;flex:none;background:#2a3b52 center/cover no-repeat;position:relative}
.scanimg .laser{position:absolute;left:8%;right:8%;top:50%;height:2px;background:rgba(255,40,40,.85);box-shadow:0 0 12px rgba(255,0,0,.8);animation:scan 2.4s ease-in-out infinite}
@keyframes scan{0%,100%{top:22%}50%{top:78%}}
@media (prefers-reduced-motion:reduce){.scanimg .laser{animation:none}.screen,.sheet,#stackwrap{transition:none!important}}
.scanmsg{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:var(--label2);text-align:center;padding:0 24px}
.scanmsg svg{width:56px;height:56px}
.scanmsg big{font-size:24px}
.scanmsg p{margin:12px 0 0;font-size:17px;line-height:22px}
.tags{padding:0 16px}
.tagrow{display:flex;justify-content:space-between;align-items:center;min-height:48px;border-bottom:.5px solid var(--sep);font-size:17px}
.tagrow:last-child{border-bottom:0}
.tagrow small{color:var(--label2);font-size:13px;display:block}
.toggle{width:51px;height:31px;border-radius:16px;background:var(--green);position:relative;flex:none}
.toggle::after{content:"";position:absolute;right:2px;top:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.2)}
.toggle.off{background:#e9e9eb}.toggle.off::after{right:auto;left:2px}
.pcard{background:#fff;border-radius:10px;margin:16px 16px 0;padding:0 15px}
.pcard .h{display:flex;justify-content:space-between;align-items:center;min-height:52px;font-size:20px;font-weight:600}
.pcard .h .pills{display:flex;gap:4px}
.prow{display:flex;justify-content:space-between;align-items:center;min-height:40px;border-top:.5px solid var(--sep);font-size:15px}
.prow:first-of-type{border-top:0}
.prow.tot{font-weight:600}
.prow .em{color:var(--blue)}

/* bulk bags */
.bk-h{margin:24px 32px 8px}
.bk-h h3{margin:0;font-size:20px;font-weight:600;display:flex;align-items:center;gap:8px}
.bk-h h3 button{color:var(--blue);width:24px;height:24px;display:grid;place-items:center}
.bk-h h3 svg{width:22px;height:22px}
.bk-h p{margin:4px 0 0;font-size:13px;color:var(--label2)}
.bk-card{background:#fff;border-radius:10px;margin:0 16px 12px;padding:0 16px}
.bk-row{display:flex;justify-content:space-between;align-items:center;min-height:44px;border-bottom:.5px solid var(--sep);font-size:17px;width:100%;text-align:left}
.bk-row .rs{color:var(--blue)}
.bk-add{color:var(--blue);min-height:44px;display:flex;align-items:center;font-size:17px;width:100%}
.bk-name{display:flex;justify-content:space-between;align-items:center;padding-top:14px;min-height:40px;font-size:17px;font-weight:600}
.bk-search{margin:0 16px 12px;height:36px;border-radius:10px;background:var(--fill);display:flex;align-items:center;gap:6px;padding:0 8px;color:var(--label2)}
.bk-search svg{width:18px;height:18px;flex:none}
.bk-search input{border:0;background:none;outline:none;font-size:17px;flex:1;min-width:0}
.bk-search input::placeholder{color:var(--label2)}
.bk-none{color:var(--label2);font-size:15px;min-height:40px;display:flex;align-items:center;border-bottom:.5px solid var(--sep)}
.step{display:flex;align-items:center;gap:6px}
.step button{width:28px;height:28px;border-radius:50%;border:1.5px solid var(--blue);color:var(--blue);display:grid;place-items:center}
.step button svg{width:14px;height:14px}
.step b{width:28px;text-align:center;font-weight:400;font-size:17px;font-variant-numeric:tabular-nums}
.bk-foot{flex:none;background:#fff;border-top:.5px solid var(--sep);height:96px;padding:0 16px;display:flex;align-items:flex-start;padding-top:22px;font-size:20px;font-weight:600}
.bk-foot span{color:var(--label2);font-weight:400;margin-right:6px}
.bk-note{font-size:13px;color:var(--label2);margin:8px 32px 0}
.mi.two{height:auto;min-height:44px;padding-block:8px}
.mi.two small{display:block;font-size:13px;color:var(--label2)}
/* vcr */
.vcrh{display:flex;justify-content:space-between;align-items:center;height:58px;padding:0 16px;background:#fff;border-bottom:.5px solid var(--sep)}
.vcrh b{font-size:22px;font-weight:500}
.vname{display:flex;justify-content:space-between;align-items:center;margin:18px 16px 8px;font-size:20px;font-weight:600}
.gold{background:rgba(160,130,60,.15);color:#7e623d;font-size:15px;font-weight:600;border-radius:12px;padding:2px 10px}
.vt{background:#fff;border-radius:10px;margin:0 16px 12px;overflow:hidden}
.vtk{display:flex;align-items:center;gap:12px;min-height:54px;padding:0 14px;border-bottom:.5px solid var(--sep)}
.vtk:last-child{border-bottom:0}
.vtk svg{width:22px;height:22px}
.vtk .x{flex:1}.vtk .x b{font-size:17px;font-weight:600;display:block}.vtk .x small{font-size:13px;color:var(--label2)}
.vtk .d{text-align:right;font-size:17px}.vtk .d small{display:block;font-size:13px;color:var(--label2)}
.vseg{display:grid;grid-template-columns:28px 90px 130px 110px 1fr 84px;align-items:center;min-height:40px;padding:0 14px;border-bottom:.5px solid var(--sep);font-size:17px;font-variant-numeric:tabular-nums}
.vseg:last-child{border-bottom:0}
.vseg .n{color:var(--label2)}
.vseg .r b{font-weight:600}
.vseg .cab{color:var(--label2);display:flex;gap:6px;align-items:center;justify-content:flex-end;padding-right:10px}
.vseg .cab i{width:18px;height:18px;border:1px solid var(--label2);border-radius:50%;font-size:10px;font-style:normal;display:grid;place-items:center}
.vst{font-size:12px;font-weight:600;color:#fff;border-radius:3px;padding:3px 0;text-align:center}
.vst.used{background:#8e8e93}.vst.lift{background:var(--green)}.vst.ci{background:var(--green)}
.fee{display:flex;align-items:center;gap:12px;min-height:54px;padding:0 14px;border-bottom:.5px solid var(--sep)}
.fee:last-child{border-bottom:0}
.fee svg{width:22px;height:22px}
.fee .x{flex:1}.fee .x b{font-size:17px;font-weight:500;display:block}.fee .x small{font-size:13px;color:var(--label2)}.fee .x small em{font-style:normal;color:var(--green)}
.fee .d{text-align:right}.fee .d b{font-weight:600}.fee .d small{display:block;font-size:13px;color:var(--label2)}
.feeh{display:flex;justify-content:space-between;font-size:12px;color:var(--label2);padding:8px 14px;border-bottom:.5px solid var(--sep)}

/* seats */
.seatwrap{padding:12px 0 160px;display:flex;flex-direction:column;align-items:center}
.sstats{background:#fff;border-radius:8px;display:flex;font-size:15px;padding:8px 0;margin-bottom:10px}
.sstats span{padding:0 14px;border-left:1px solid var(--sep)}
.sstats span:first-child{border-left:0}
.zone{width:452px;margin-top:10px}
.cols{display:flex;justify-content:center;background:#e9e9ee;height:30px;align-items:center;font-size:15px;color:var(--label2);border-radius:2px}
.zh{display:flex;justify-content:space-between;font-size:15px;margin:12px 0 10px}
.zh b{font-weight:600}.zh span{color:var(--label2)}
.srow{display:flex;justify-content:center;align-items:center;gap:4px;margin-bottom:4px}
.st{width:40px;height:40px;border-radius:3px;background:#003a63;display:grid;place-items:center;font-size:12px;font-weight:600;color:#fff;cursor:pointer}
.st.fc{background:#001f3d}
.st.av{background:#fff;border:2px solid var(--blue)}
.st.blk{background:var(--blue)}
.st.at3{background:#c3e08a;color:#fff}
.st.me{background:#69aee0}
.st.gap{background:none;cursor:default}
.st.rn{background:none;color:var(--label2);font-weight:400;font-size:13px;cursor:default;width:30px}
.sgcards{position:absolute;left:0;right:0;bottom:24px;height:120px;display:flex;gap:16px;padding:0 60px;overflow-x:auto;scrollbar-width:none;scroll-snap-type:x mandatory}
.sgcards::-webkit-scrollbar{display:none}
.sgc{flex:none;width:548px;scroll-snap-align:center;background:#fff;border-radius:10px;box-shadow:0 4px 18px rgba(0,0,0,.12);padding:16px 22px;text-align:left}
.sgc.on{box-shadow:0 0 0 2px var(--blue),0 4px 18px rgba(0,0,0,.12)}
.sgc .h{display:flex;gap:14px;align-items:center;font-size:20px}
.sgc .h b{font-weight:600}
.sgc .h .sp{flex:1}
.sgc small{display:block;font-size:12px;color:var(--label2);margin-top:14px}

/* popovers / menus */
#poplayer{position:absolute;inset:0;z-index:50;display:none}
#poplayer.on{display:block}
#poplayer .scrim{position:absolute;inset:0}
#poplayer.dim .scrim{background:rgba(0,0,0,.2)}
.menu{position:absolute;width:250px;background:rgba(242,242,244,.96);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);border-radius:13px;box-shadow:0 10px 50px rgba(0,0,0,.22);overflow:hidden;transform-origin:top right;animation:pop .2s cubic-bezier(.2,.9,.3,1.2)}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}
.mi{display:flex;justify-content:space-between;align-items:center;width:100%;min-height:44px;padding:0 16px;font-size:17px;text-align:left;border-bottom:.5px solid rgba(60,60,67,.25)}
.mi:last-child{border-bottom:0}
.mi:active,.mi:hover{background:rgba(0,0,0,.05)}
.mi .r{display:flex;align-items:center;gap:8px}
.mi svg{width:22px;height:22px}
.mi .r .c{width:8px;height:13px;color:var(--label3);display:grid}
.mi .r .c svg{width:8px;height:13px}
.mi.red{color:var(--red)}
.mi.back{color:var(--blue);justify-content:flex-start;gap:6px;font-weight:600}
.msep{height:8px;background:rgba(60,60,67,.12)}
.formsheet{position:absolute;left:102px;top:max(40px,calc(50% - 320px));width:540px;height:640px;background:var(--grouped);border-radius:13px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.25);animation:fsin .3s cubic-bezier(.2,.85,.2,1)}
@keyframes fsin{from{transform:translateY(80px);opacity:0}to{transform:none;opacity:1}}
.formsheet .bd{flex:1;overflow:auto;padding:0 16px}
.formsheet .gh{display:flex;justify-content:space-between;font-weight:600;margin:22px 16px 8px}
.formsheet .gh button{color:var(--blue);font-weight:400}
.fgrp{background:#fff;border-radius:10px;overflow:hidden}
.frow{display:flex;align-items:center;gap:20px;min-height:44px;padding:0 16px;width:100%;text-align:left;position:relative}
.frow::after{content:"";position:absolute;left:60px;right:0;bottom:0;border-bottom:.5px solid var(--sep)}
.frow.nb::after{left:16px}
.frow:last-child::after{display:none}
.cbx{width:22px;height:22px;border-radius:4px;border:1.5px solid #b9b9bf;display:grid;place-items:center;flex:none}
.cbx.on{background:var(--blue);border-color:var(--blue);color:#fff}
.cbx svg{width:14px;height:14px;opacity:0}.cbx.on svg{opacity:1}
.fbtns{display:flex;gap:16px;padding:16px}
.fbtns button{flex:1;height:42px;border-radius:8px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:6px}
.fbtns .o{border:2px solid var(--blue);color:var(--blue)}
.fbtns .o svg{width:20px;height:20px}
.fbtns .p{background:var(--blue);color:#fff}
.fbtns button:disabled{opacity:.4;cursor:default}
.toast{position:absolute;left:50%;top:64px;transform:translate(-50%,-30px);opacity:0;z-index:80;background:rgba(30,30,32,.92);color:#fff;border-radius:22px;padding:11px 20px;font-size:15px;font-weight:500;display:flex;gap:8px;align-items:center;transition:all .3s cubic-bezier(.2,.9,.3,1.2);pointer-events:none;white-space:nowrap}
.toast.on{transform:translate(-50%,0);opacity:1}
.toast svg{width:18px;height:18px;color:#34c759}
/* hotspot flash (like Figma's) */
#device.flash [data-act]{box-shadow:0 0 0 2px rgba(0,116,200,.55) inset!important;background-color:rgba(0,116,200,.08)!important;transition:none}
</style>

SCREENS.seats=({g:gid})=>{

 const A=['A','B','|','C','G','|','H','J'];
 const B=['A','B','|','C','D','E','G','|','H','J'];
 let za='',zb='';
 for(const r of [1,2,3])za+=row(A,r,'fc');

  zb+=row(cols,r,'',sp);
 }

/* ---------- navigation ---------- */
let stack=[]; // {name, params, el}
let sheets=[];
function renderScreen(entry){
 const sc=entry.el.querySelector('.scroll'); const top=sc?sc.scrollTop:0;
 const sg=entry.el.querySelector('#sgcards'); const sgl=sg?sg.scrollLeft:0;
 const itin=entry.el.querySelector('.itin'); const il=itin?itin.scrollLeft:0;
 const focusId=document.activeElement&&entry.el.contains(document.activeElement)?document.activeElement.id:null;
 const caret=focusId&&document.activeElement.selectionStart;
 entry.el.innerHTML=(entry.kind==='sheet'?SHEETS:SCREENS)[entry.name](entry.params||{});
 const sc2=entry.el.querySelector('.scroll'); if(sc2)sc2.scrollTop=top;
 const sg2=entry.el.querySelector('#sgcards'); if(sg2)sg2.scrollLeft=sgl;
 const it2=entry.el.querySelector('.itin'); if(it2)it2.scrollLeft=il;
 if(focusId){const f=entry.el.querySelector('#'+focusId);if(f){f.focus();try{f.setSelectionRange(caret,caret)}catch(e){}}}
}
function refresh(){stack.forEach(renderScreen);sheets.forEach(renderScreen)}
function push(name,params,instant){
 const el=document.createElement('div');el.className='screen'+(instant?'':' off-right');
 const entry={name,params,el,kind:'screen'};renderScreen(entry);wrap.appendChild(el);
 const prev=stack[stack.length-1];stack.push(entry);
 if(!instant){requestAnimationFrame(()=>requestAnimationFrame(()=>{el.classList.remove('off-right');if(prev)prev.el.classList.add('off-left','under')}))}
}
function pop(){
 if(stack.length<2)return;const e=stack.pop();const prev=stack[stack.length-1];
 renderScreen(prev);
 e.el.classList.add('off-right');prev.el.classList.remove('off-left','under');
 setTimeout(()=>e.el.remove(),380);
}
function replaceTop(name,params){const e=stack[stack.length-1];e.name=name;e.params=params;renderScreen(e)}
function present(name,params){
 closePop();
 const el=document.createElement('div');el.className='sheet';
 const entry={name,params,el,kind:'sheet'};renderScreen(entry);sheetL.appendChild(el);sheets.push(entry);
 dev.classList.add('sheeted');dev.classList.toggle('sheeted2',sheets.length>1);
 requestAnimationFrame(()=>requestAnimationFrame(()=>el.classList.add('in')));
}
function dismiss(){
 const e=sheets.pop();if(!e)return;e.el.classList.remove('in');setTimeout(()=>e.el.remove(),400);
 if(!sheets.length)dev.classList.remove('sheeted');dev.classList.toggle('sheeted2',sheets.length>1);
 st._scans=null;st._airline=null;
 stack.forEach(renderScreen);
}

/* popovers */
function openMenu(anchor,items,opts={}){
 popL.innerHTML='<div class="scrim" data-act="closepop"></div>';popL.className='on'+(opts.dim?' dim':'');
 const m=document.createElement('div');m.className='menu';m.innerHTML=items;popL.appendChild(m);
 const dr=dev.getBoundingClientRect(),ar=anchor.getBoundingClientRect(),sc=dr.width/744;
 let x=(ar.right-dr.left)/sc-250, y=(ar.bottom-dr.top)/sc+8;
 if(opts.left){x=(ar.left-dr.left)/sc}
 x=Math.max(12,Math.min(x,744-262));
 m.style.left=x+'px';m.style.top=y+'px';
 const H=dev.offsetHeight;const h=m.offsetHeight; if(y+h>H-40){y=(ar.top-dr.top)/sc-h-8;m.style.top=y+'px';m.style.transformOrigin='bottom right'}
 popL._menu=m;
}
function closePop(){popL.className='';popL.innerHTML=''}
function formSheet(html){popL.innerHTML='<div class="scrim" data-act="closepop"></div>';popL.className='on dim';const f=document.createElement('div');f.className='formsheet';f.innerHTML=html;popL.appendChild(f);popL._fs=f}

const mi=(t,ic,act,extra='',sub)=>`<button class="mi ${extra}" data-act="${act}"${sub||''}><span>${t}</span><span class="r">${ic}${extra.includes('has')?`<span class="c">${I.chevR}</span>`:''}</span></button>`;
function addMenu(btn,gid){
 openMenu(btn,
  mi('Profile',I.person,'add-profile','has',` data-g="${gid}"`)+mi('Document',I.doc,'add-document','has',` data-g="${gid}"`)+mi('Bag',I.suitcase,'add-bag','has',` data-g="${gid}"`)+mi('Special Service',I.ssr,'add-ssr','',` data-g="${gid}"`)+mi('Seat',I.seat,'add-seat','',` data-g="${gid}"`)+mi('Lap Infant',I.infant,'add-infant','',` data-g="${gid}"`));
 popL._anchor=btn;
}

/* ---------- fit device to viewport ---------- */
const stage=document.getElementById('stage');
function fit(){
 const vv=window.visualViewport;
 const vw=Math.round(vv?vv.width*vv.scale:window.innerWidth),vh=Math.round(vv?vv.height*vv.scale:window.innerHeight);
 const touch=window.matchMedia('(pointer: coarse)').matches||navigator.maxTouchPoints>0;
 const short=Math.min(vw,vh),long=Math.max(vw,vh);
 // an iPad-class screen (iPad mini is 744 × 1133): run full screen with no frame or side panel
 const bare=(touch&&short>=600&&long<=1400)||(vw>=700&&vw<=834&&vh>=900);
 document.body.classList.toggle('bare',bare);
 document.documentElement.classList.toggle('bare-root',bare);
 let s,H=1133;
 if(bare){
  if(vw<=vh){s=vw/744;H=Math.round(vh/s)}   // portrait: fill width, stretch height to the screen
  else{s=vh/1133}                          // landscape: the design is portrait, so fit height and centre
 }else{
  const wide=vw>1100;const availW=wide?vw-280-28-64:vw-40;const availH=wide?vh-48:Math.max(vh-48,600);s=Math.max(.3,Math.min(1,availW/764,availH/1153));
 }
 dev.style.height=H+'px';
 dev.style.transform=`scale(${s})`;
 const pad=bare?0:11;
 stage.style.width=(744*s+(bare?0:pad*2*s))+'px';stage.style.height=(H*s+(bare?0:pad*2*s))+'px';
 dev.style.left=(bare?0:pad*s)+'px';dev.style.top=(bare?0:pad*s)+'px';dev.style.position='absolute';
}
window.addEventListener('resize',fit);
window.addEventListener('orientationchange',()=>setTimeout(fit,250));
if(window.visualViewport)window.visualViewport.addEventListener('resize',fit);
fit();

/* ---------- test tasks rail ---------- */
const TASKS=['Verify the type of kennel for Clayton’s AVIH','Check Valerie’s documents','Add a Bag to Clayton','Open the seat map','View Clayton’s Atmos Rewards Number','Open the reservation Remarks','Check in Anita and Valerie','Print a boarding pass'];

function drawTasks(){tl.innerHTML=TASKS.map((t,i)=>`<li class="${done.includes(i)?'done':''}"><input type="checkbox" id="task${i}" ${done.includes(i)?'checked':''}><label for="task${i}">${t}</label></li>`).join('')}
drawTasks();
tl.addEventListener('change',e=>{const i=+e.target.id.slice(4);done=e.target.checked?[...done,i]:done.filter(x=>x!==i);try{localStorage.setItem('lh-tasks',JSON.stringify(done))}catch(_){}drawTasks()});
document.getElementById('clearTasks').addEventListener('click',()=>{done=[];try{localStorage.removeItem('lh-tasks')}catch(_){}drawTasks()});
})();
